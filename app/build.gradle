plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nishant.glasshome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nishant.glasshome'
        minSdk 26
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        // Fixed key kept in the repo so every new build installs as an update over the last one.
        personal {
            storeFile file('glasshome.jks')
            storePassword 'glasshome'
            keyAlias 'glasshome'
            keyPassword 'glasshome'
        }
    }

    buildTypes {
        release {
            // R8: shrinks and optimises the code (smaller install, faster cold start)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.personal
        }
        debug {
            signingConfig signingConfigs.personal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // installs the startup profile (src/main/baseline-prof.txt), so Home opens from cold without waiting on the JIT
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
}
